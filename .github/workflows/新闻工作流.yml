# ============================================================
# 工作流名称：新闻爬虫批量执行（多IP并行版）
# 功能描述：定时或手动触发，最多 20 个 runner 并发，执行 25 个 Python 爬虫
#          矩阵策略实现并行执行，25 个任务排队（前 20 并发、剩余 5 补充）
#          每个爬虫独立 runner：记录节点 IP、耗时、成功/失败
#          全部完成后汇总统计、打包数据、计算 SHA256、创建 Release
#          通过邮件和 Telegram 发送通知（含全部节点 IP 与耗时）
# 文件路径：.github/workflows/新闻工作流.yml
# 魔改自：通达信数据获取.yml（通达信多IP并行下载工作流）
# 更新时间：2026-07-30
# ============================================================

name: 新闻爬虫批量执行（多IP并行）

# ============================================================
# 触发条件配置
# ============================================================
on:
  schedule:
    # 定时触发：每天两次（北京时间 09:00 与 23:00）
    # 北京时间 = UTC+8 → 09:00 = UTC 01:00，23:00 = UTC 15:00
    - cron: '0 1 * * *'
    - cron: '0 15 * * *'
  # 手动触发：允许在 GitHub 页面手动运行，并可传入参数
  workflow_dispatch:
    inputs:
      install_playwright:
        description: '是否安装 Playwright 浏览器（部分爬虫降级渲染需要）'
        type: boolean
        default: false
      make_release:
        description: '是否把所有爬虫产出打包上传为 GitHub Release'
        type: boolean
        default: true
      crawl_args:
        description: '传给每个爬虫的额外命令行参数（如 --no-detail）'
        type: string
        default: ''

# ============================================================
# 权限配置
# ============================================================
permissions:
  contents: write  # 允许创建/更新 Release
  actions: read    # 允许读取工作流运行信息

# 防止重叠运行：同一分支同时只跑一个实例，新触发排队而非取消
concurrency:
  group: news-crawlers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # 作业0：记录工作流开始时间（所有 job 之前执行）
  # ============================================================
  record-start-time:
    runs-on: ubuntu-latest
    outputs:
      workflow_start: ${{ steps.set_start.outputs.workflow_start }}
      workflow_start_time: ${{ steps.set_start.outputs.workflow_start_time }}
    steps:
      - name: 记录工作流开始时间
        id: set_start
        run: |
          WORKFLOW_START=$(date -u +%s)
          WORKFLOW_START_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          echo "工作流开始时间戳: $WORKFLOW_START"
          echo "工作流开始时间: $WORKFLOW_START_TIME (北京时间)"
          echo "workflow_start=${WORKFLOW_START}" >> $GITHUB_OUTPUT
          echo "workflow_start_time=${WORKFLOW_START_TIME}" >> $GITHUB_OUTPUT

  # ============================================================
  # 作业1：多 runner 并行执行 25 个爬虫（矩阵策略）
  # 说明：max-parallel: 20 配合 25 个矩阵项，GitHub 会先并发 20 个，
  #       剩余 5 个排队等待；前 20 每完成一个即补位一个，
  #       最终表现为「第一批 20 + 第二批 5」的并行队列。
  # ============================================================
  run-crawlers:
    needs: record-start-time
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 单个爬虫 job 超时上限（GitHub 单 job 上限 6h，已拉满；GitHub 仓库设置里没有可改的「Workflow timeout」项，无需改动）
    strategy:
      fail-fast: false    # 单个爬虫失败不影响其他
      max-parallel: 20     # 最多 20 线程并行（GitHub 免费版上限内）
      matrix:
        # 每个爬虫：name=英文短标识（用于 artifact/日志），file=真实中文文件名
        file:
          - { name: cna,        file: 中央通讯社爬虫.py }
          - { name: bbc,        file: 英国广播公司爬虫.py }
          - { name: aa,         file: 阿纳多卢通讯社爬虫.py }
          - { name: mena,       file: 埃及中东通讯社爬虫.py }
          - { name: belta,      file: 白俄罗斯通讯社爬虫.py }
          - { name: aljazeera,  file: 半岛电视台爬虫.py }
          - { name: asahi,      file: 朝日新闻爬虫.py }
          - { name: donga,      file: 东亚日报爬虫.py }
          - { name: rg,         file: 俄罗斯报爬虫.py }
          - { name: sputnik,    file: 俄罗斯卫星通讯社爬虫.py }
          - { name: ria,        file: 俄新社爬虫.py }
          - { name: gnews,      file: 谷歌新闻爬虫.py }
          - { name: straitstimes, file: 海峡时报爬虫.py }
          - { name: yna,        file: 韩联社爬虫.py }
          - { name: bernama,    file: 马来西亚国家通讯社爬虫.py }
          - { name: mk,         file: 每日经济新闻爬虫.py }
          - { name: scmp,       file: 南华早报爬虫.py }
          - { name: bloomberg,  file: 彭博社爬虫.py }
          - { name: tass,       file: 塔斯社爬虫.py }
          - { name: ukrinform,  file: 乌克兰国家通讯社爬虫.py }
          - { name: irna_fa,    file: 伊朗通讯社波斯语爬虫.py }
          - { name: irna_zh,    file: 伊朗通讯社中文网爬虫.py }
          - { name: thehindu,   file: 印度教徒报爬虫.py }
          - { name: nikkei,     file: 日本经济新闻爬虫.py }

    steps:
      # ----------------------------------------------------------
      # 步骤1：检出仓库（拿到 .py 爬虫与 data/ 目录）
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # ----------------------------------------------------------
      # 步骤2：配置 Python 环境
      # ----------------------------------------------------------
      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      # ----------------------------------------------------------
      # 步骤3：安装依赖（优先 requirements.txt，否则装基础包）
      # ----------------------------------------------------------
      - name: 安装基础依赖
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests beautifulsoup4 lxml
          fi

      # ----------------------------------------------------------
      # 步骤4：缓存 Playwright 浏览器二进制
      # ~/.cache/ms-playwright 体积大(~150MB)，缓存后二次运行秒级恢复
      # 仅在勾选 install_playwright 时与步骤4安装同步生效
      # ----------------------------------------------------------
      - name: 缓存 Playwright 浏览器
        if: ${{ inputs.install_playwright == true }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-browser-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pw-browser-${{ runner.os }}-

      # ----------------------------------------------------------
      # 步骤4：安装 Playwright 浏览器
      # 仅在手动触发且勾选 install_playwright 时执行（耗时较大）
      # 浏览器二进制已由上方缓存步骤恢复，命中缓存时跳过下载仅补系统依赖
      # ----------------------------------------------------------
      - name: 安装 Playwright 浏览器
        if: ${{ inputs.install_playwright == true }}
        run: |
          pip install playwright
          playwright install --with-deps chromium

      # ----------------------------------------------------------
      # 步骤5：执行爬虫并记录节点 IP / 耗时 / 状态
      # ----------------------------------------------------------
      - name: 执行 ${{ matrix.file.file }}
        id: run_py
        continue-on-error: true   # 允许失败，结果记入 result.txt，不中断矩阵
        working-directory: ${{ github.workspace }}   # 仓库根（爬虫脚本在 .github/workflows/news/ 子目录）
        run: |
          NODE_START=$(date -u +%s)
          IP=$(curl -s https://api64.ipify.org?format=json | jq -r '.ip')
          echo "执行节点 IP: $IP"
          echo "当前目录: $(pwd)"
          # 爬虫脚本存放目录（仓库根下的 .github/workflows/news/）
          SCRIPTS_DIR=".github/workflows/news"
          SCRIPT_PATH="$SCRIPTS_DIR/${{ matrix.file.file }}"
          LOG_FILE="crawler_run.log"
          echo "正在执行: $SCRIPT_PATH"

          # 防御：确认爬虫脚本存在于 news 子目录，避免路径错位导致含糊失败
          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "错误：找不到爬虫脚本 $SCRIPT_PATH（应在 ${SCRIPTS_DIR}/ 目录）"
            STATUS="MISSING"
          else
            # 前台直接执行爬虫，日志落盘；以进程退出码判定成败
            python "$SCRIPT_PATH" ${{ inputs.crawl_args }} > "$LOG_FILE" 2>&1
            RC=$?
            if [ "$RC" -eq 0 ]; then
              STATUS="SUCCESS"
            else
              STATUS="FAILED"
            fi
          fi

          NODE_END=$(date -u +%s)
          NODE_DURATION=$((NODE_END - NODE_START))
          echo "执行结束 - 状态: $STATUS - 节点耗时: ${NODE_DURATION}秒 - IP: ${IP}"

          # 结果格式：英文名|中文文件名|状态|耗时(秒)|节点IP
          echo "${{ matrix.file.name }}|${{ matrix.file.file }}|${STATUS}|${NODE_DURATION}|${IP}" > result.txt

      # ----------------------------------------------------------
      # 步骤6：收集产出并上传 Artifact（结果 + 日志 + 爬虫产出 json）
      # 即使爬虫失败（step5 标记 continue-on-error）也上传，供汇总
      # ----------------------------------------------------------
      - name: 上传结果到 Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-${{ matrix.file.name }}
          path: |
            result.txt
            data/新闻/**/*.json
          retention-days: 7
          if-no-files-found: ignore   # 爬虫失败时可能没有 json，忽略

  # ============================================================
  # 作业2：汇总统计、打包、Release、通知
  # 等待所有爬虫（含失败）完成后执行；always() 确保即使有失败也汇总
  # ============================================================
  collect-and-release:
    needs: [record-start-time, run-crawlers]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAIL_ADDRESS: ${{ secrets.MAIL_ADDRESS }}
      MAIL_PORT: ${{ secrets.MAIL_PORT }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

    steps:
      - name: 获取工作流开始时间
        id: start_time
        run: |
          echo "工作流开始时间戳: ${{ needs.record-start-time.outputs.workflow_start }}"
          echo "工作流开始时间: ${{ needs.record-start-time.outputs.workflow_start_time }} (北京时间)"

      - name: 获取当前日期与时段标识
        id: date
        run: |
          # 日期（YYYY-MM-DD）
          echo "date=$(TZ='Asia/Shanghai' date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          # 完整时间
          echo "datetime=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
          # 时段标识：北京时间 00:00–11:59 → am，12:00–23:59 → pm
          # 用于每天两次跑时区分 Release tag / 目录 / 打包名，避免同一天撞名
          HR=$(TZ='Asia/Shanghai' date +%H)
          if [ "$HR" -lt 12 ]; then SLOT="am"; else SLOT="pm"; fi
          echo "slot=${SLOT}" >> $GITHUB_OUTPUT
          echo "时段标识(am=上午/pm=晚上): ${SLOT}"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: 下载所有分片 Artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: crawler-*

      # ----------------------------------------------------------
      # 汇总：收集每个爬虫的 result.txt（状态/耗时/IP），统计成败
      # ----------------------------------------------------------
      - name: 收集执行结果并汇总
        id: collect
        run: |
          SUMMARY_DIR="${{ steps.date.outputs.date }}-${{ steps.date.outputs.slot }}"
          mkdir -p "$SUMMARY_DIR/news"
          mkdir -p "data/新闻"

          IP_LIST=""
          IP_TABLE_MD="| 序号 | 英文名 | 中文文件名 | 节点IP | 耗时 | 状态 |\n"
          IP_TABLE_MD="${IP_TABLE_MD}|------|--------|----------|------------|------|------|\n"
          IP_TABLE_HTML=""
          total_duration_all=0
          max_duration=0
          success=0
          failed=0
          counter=1

          echo "============================================================"
          echo "  新闻爬虫批量执行 - 汇总"
          echo "============================================================"

          for artifact_dir in artifacts/crawler-*/; do
            [ -d "$artifact_dir" ] || continue

            # 收集爬虫产出的 json：落到 data/新闻/（即数据处理脚本默认读取的目录）
            if [ -d "${artifact_dir}data/新闻" ]; then
              mkdir -p "data/新闻"
              cp -r "${artifact_dir}data/新闻/." "data/新闻/" 2>/dev/null || true
            fi

            if [ -f "${artifact_dir}result.txt" ]; then
              IFS='|' read -r ename cname status dur ip < "${artifact_dir}result.txt"

              # 统计
              if [ "$status" = "SUCCESS" ]; then
                success=$((success + 1))
              else
                failed=$((failed + 1))
              fi
              total_duration_all=$((total_duration_all + dur))
              if [ "$dur" -gt "$max_duration" ]; then
                max_duration=$dur
              fi

              cs=$(printf "%2d" $counter)
              echo "[$cs/25] $ename ($cname) -> $status | ${dur}s | IP:$ip"

              IP_TABLE_MD="${IP_TABLE_MD}| $counter | $ename | $cname | $ip | ${dur}s | $status |\n"
              if [ "$status" = "FAILED" ]; then badge="<span class=\"badge badge-fail\">❌ 失败</span>"; else badge="<span class=\"badge badge-ok\">✅ 成功</span>"; fi
              IP_TABLE_HTML="${IP_TABLE_HTML}<tr><td class=\"num\">$counter</td><td>$ename</td><td class=\"cname\">$cname</td><td class=\"ip-highlight\">$ip</td><td class=\"dur\">${dur}s</td><td>$badge</td></tr>\n"

              if [ -n "$IP_LIST" ]; then IP_LIST="${IP_LIST}, ${ip}"; else IP_LIST="${ip}"; fi
              counter=$((counter + 1))
            fi
          done

          # 同步一份到 SUMMARY_DIR/news 供后续打包与 SHA256 校验使用
          cp -r "data/新闻/." "$SUMMARY_DIR/news/" 2>/dev/null || true

          rm -rf artifacts

          echo "------------------------------------------------------------"
          echo "  成功: $success | 失败: $failed | 总爬虫数: $((success + failed))"
          echo "  所有节点耗时总和(串行参考): ${total_duration_all}s"
          echo "  最长单任务耗时(并行参考): ${max_duration}s"
          echo "  所有节点 IP: $IP_LIST"
          echo "------------------------------------------------------------"

          echo "$IP_LIST" > ip_list.txt
          echo -e "$IP_TABLE_MD" > ip_table_md.txt
          echo -e "$IP_TABLE_HTML" > ip_table_html.txt

          echo "ip_list=${IP_LIST}" >> $GITHUB_OUTPUT
          echo "success=${success}" >> $GITHUB_OUTPUT
          echo "failed=${failed}" >> $GITHUB_OUTPUT
          echo "total=$((success + failed))" >> $GITHUB_OUTPUT
          echo "total_duration_all=${total_duration_all}" >> $GITHUB_OUTPUT
          echo "max_duration=${max_duration}" >> $GITHUB_OUTPUT

          if [ "$((success + failed))" -eq 0 ]; then
            echo "错误：没有任何爬虫结果！"
            exit 1
          fi

      # ----------------------------------------------------------
      # 运行新闻数据处理脚本：对爬取完成的原始 JSON 做去重/分类，
      # 生成「简报版」+「完整版」两份 Markdown 日报。
      # 脚本默认读取 ./data/新闻/*.json（即上面已汇总到 data/新闻 的数据），
      # 输出 news_daily_{date}.md（简报）与 news_daily_{date}_full.md（完整版）到 $SUMMARY_DIR。
      # ----------------------------------------------------------
      - name: 设置 Python（数据处理用）
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 运行新闻数据处理脚本生成日报
        run: |
          SUMMARY_DIR="${{ steps.date.outputs.date }}-${{ steps.date.outputs.slot }}"
          DATE="${{ steps.date.outputs.date }}"
          # 数据已在 data/新闻/ 汇总；若为空则给出提示但继续执行（不阻断后续打包/发布）
          if [ ! -d "data/新闻" ] || [ -z "$(ls -A data/新闻 2>/dev/null)" ]; then
            echo "警告：data/新闻 目录为空，跳过日报生成"
          else
            python3 .github/workflows/news/新闻数据处理.py --input data/新闻 --output "$SUMMARY_DIR" --date "$DATE"
            echo "=== 生成的日报文件 ==="
            ls -lh "$SUMMARY_DIR"/news_daily_*.md 2>/dev/null || echo "未生成日报"
          fi

      # ----------------------------------------------------------
      # 计算所有产出 json 的 SHA256（若有）
      # ----------------------------------------------------------
      - name: 计算 SHA256 校验值
        run: |
          SUMMARY_DIR="${{ steps.date.outputs.date }}-${{ steps.date.outputs.slot }}"
          cd "$SUMMARY_DIR" 2>/dev/null || { echo "无汇总目录，跳过"; exit 0; }
          {
            echo "# SHA256 校验值"
            echo "# 生成时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S') 北京时间"
            echo ""
            find news -name '*.json' | while read f; do
              sha=$(sha256sum "$f" | awk '{print $1}')
              echo "$sha  $f"
            done
          } > SHA256SUMS.txt 2>/dev/null || true
          echo "校验文件已生成（若存在 json）"

      # ----------------------------------------------------------
      # 打包汇总数据（所有爬虫 json + 校验文件）
      # ----------------------------------------------------------
      - name: 打包汇总数据
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUMMARY_DIR="${{ steps.date.outputs.date }}-${{ steps.date.outputs.slot }}"
          BASE="新闻数据${SUMMARY_DIR}"
          TAG="v${SUMMARY_DIR}"

          # 默认名；若 Release 中已存在同名 asset（同 slot 重跑），则自动递增 -1 / -2 / -3
          # 避免 softprops/action-gh-release 在 overwrite 上传 zip 时的 already_exists 竞态
          ZIP_NAME="${BASE}.zip"
          EXISTING=""
          if gh release view "$TAG" >/dev/null 2>&1; then
            EXISTING=$(gh release view "$TAG" --json assets -q ".assets[].name" 2>/dev/null || true)
          fi
          n=1
          while printf '%s\n' "$EXISTING" | grep -qx "$ZIP_NAME"; do
            ZIP_NAME="${BASE}-${n}.zip"
            n=$((n + 1))
          done
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "最终 zip 名（撞名自动递增）: $ZIP_NAME"

          if [ -d "$SUMMARY_DIR" ]; then
            cd "$SUMMARY_DIR" && zip -9 -r "../${ZIP_NAME}" . && cd ..
            ls -lh "$ZIP_NAME"
          else
            echo "无数据目录，跳过打包"
            touch "$ZIP_NAME"   # 占位，避免 Release 步骤报错
          fi

      # ----------------------------------------------------------
      # 计算工作流总运行时间
      # ----------------------------------------------------------
      - name: 计算工作流总运行时间
        id: run_time
        run: |
          end=$(date -u +%s)
          start=${{ needs.record-start-time.outputs.workflow_start }}
          total_duration=$((end - start))
          total_minutes=$((total_duration / 60))
          total_seconds=$((total_duration % 60))
          end_time=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')

          echo "============================================================"
          echo "  工作流运行时间统计"
          echo "  开始: ${{ needs.record-start-time.outputs.workflow_start_time }} (北京时间)"
          echo "  结束: ${end_time} (北京时间)"
          echo "  总运行: ${total_minutes}分${total_seconds}秒"
          echo "  最长单任务耗时(并行参考): ${{ steps.collect.outputs.max_duration }}s"
          echo "============================================================"

          echo "end_time=${end_time}" >> $GITHUB_OUTPUT
          echo "duration=${total_minutes}分${total_seconds}秒" >> $GITHUB_OUTPUT
          echo "duration_seconds=${total_duration}" >> $GITHUB_OUTPUT

      - name: 获取汇总服务器 IP
        run: |
          MERGE_IP=$(curl -s https://api64.ipify.org?format=json | jq -r '.ip')
          echo "MERGE_IP=${MERGE_IP}" >> $GITHUB_ENV

      # ----------------------------------------------------------
      # 构建 Release 说明
      # ----------------------------------------------------------
      - name: 构建 Release Body
        id: build_body
        run: |
          IP_TABLE_MD=$(cat ip_table_md.txt)
          cat > release_body.md << RELEASE_EOF
          ## 🕷️ 新闻爬虫批量执行（多IP并行）

          ### ⏱️ 执行信息
          | 项目 | 内容 |
          |------|------|
          | **执行日期** | ${{ steps.date.outputs.date }} |
          | **开始时间** | ${{ needs.record-start-time.outputs.workflow_start_time }} (北京时间) |
          | **结束时间** | ${{ steps.run_time.outputs.end_time }} (北京时间) |
          | **总运行耗时** | ${{ steps.run_time.outputs.duration }} |
          | **并行模式** | 🌐 最多 20 runner 并发（25 爬虫排队） |
          | **汇总IP** | ${{ env.MERGE_IP }} |
          | **成功 / 失败** | ${{ steps.collect.outputs.success }} / ${{ steps.collect.outputs.failed }} |
          | **最长单任务耗时** | ${{ steps.collect.outputs.max_duration }}秒 |

          > 📊 25 个爬虫在最多 20 并发下排队执行：前 20 先跑，剩余 5 个补位。

