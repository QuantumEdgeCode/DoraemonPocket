      # ----------------------------------------------------------
      # 发送 Telegram 通知（摘要 + IP 列表）
      # 安全：丢弃 API 响应，仅输出 HTTP 状态码
      # ----------------------------------------------------------
      - name: 发送 Telegram 通知
        if: env.TG_BOT_TOKEN && env.TG_CHAT_ID
        run: |
          MESSAGE="🕷️ 新闻爬虫批量执行完成

          日期: ${{ steps.date.outputs.date }}
          总耗时: ${{ steps.run_time.outputs.duration }}
          成功/失败: ${{ steps.collect.outputs.success }} / ${{ steps.collect.outputs.failed }}
          最长单任务耗时: ${{ steps.collect.outputs.max_duration }}秒

          执行节点IP:
          ${{ steps.collect.outputs.ip_list }}

          🔗 https://github.com/${{ github.repository }}/releases/tag/v${{ steps.date.outputs.date }}"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d text="$MESSAGE")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Telegram 通知发送成功 (HTTP $HTTP_CODE)"
          else
            echo "⚠️ Telegram 通知发送失败 (HTTP $HTTP_CODE)"
          fi
