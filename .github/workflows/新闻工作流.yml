            ${{ steps.date.outputs.date }}-${{ steps.date.outputs.slot }}/news_daily_${{ steps.date.outputs.date }}.md
            ${{ steps.date.outputs.date }}-${{ steps.date.outputs.slot }}/news_daily_${{ steps.date.outputs.date }}_full.md
